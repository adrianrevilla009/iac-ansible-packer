---
- name: Install the JRE
  ansible.builtin.apt:
    name: "{{ jvm_package }}"
    state: present
    update_cache: true

- name: Create the service user
  ansible.builtin.user:
    name: "{{ jvm_app_user }}"
    system: true
    shell: /usr/sbin/nologin

- name: Create the app directory
  ansible.builtin.file:
    path: "{{ jvm_app_dir }}"
    state: directory
    owner: "{{ jvm_app_user }}"
    mode: "0755"

- name: Install the systemd unit
  ansible.builtin.template:
    src: orders.service.j2
    dest: /etc/systemd/system/orders.service
    mode: "0644"
  notify: Restart orders
