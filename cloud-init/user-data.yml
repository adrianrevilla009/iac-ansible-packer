#cloud-config
hostname: orders-1
package_update: true
packages:
  - openjdk-21-jre-headless
users:
  - name: orders
    system: true
    shell: /usr/sbin/nologin
write_files:
  - path: /etc/orders/orders.env
    owner: root:root
    permissions: "0644"
    content: |
      SERVER_PORT=8080
      JAVA_OPTS=-Xmx256m
runcmd:
  - [mkdir, -p, /opt/orders]
  - [chown, "orders:", /opt/orders]
final_message: "orders host ready after $UPTIME seconds"
